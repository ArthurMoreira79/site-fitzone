<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Logo FitZone — prévia</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; }
  .faixa { padding: 48px 32px; display: flex; gap: 48px; align-items: center; flex-wrap: wrap; }
  .escura { background: #2D3142; }
  .clara { background: #FFFFFF; border-bottom: 1px solid #BFC0C0; }
  .coral { background: #EF8354; }
  img.grande { height: 72px; }
  img.media { height: 32px; }
  img.fav { height: 64px; }
  img.fav-p { height: 16px; }
</style>
</head>
<body>
  <div class="faixa escura">
    <img class="grande" src="logo-fitzone-fundo-escuro.svg" alt="FitZone">
    <img class="media" src="logo-fitzone-fundo-escuro.svg" alt="FitZone">
    <img class="fav" src="favicon-fitzone.svg" alt="">
    <img class="fav-p" src="favicon-fitzone.svg" alt="">
  </div>
  <div class="faixa clara">
    <img class="grande" src="logo-fitzone-fundo-claro.svg" alt="FitZone">
    <img class="media" src="logo-fitzone-fundo-claro.svg" alt="FitZone">
    <img class="fav" src="favicon-fitzone.svg" alt="">
  </div>
  <div class="faixa coral">
    <img class="grande" src="logo-fitzone-fundo-claro.svg" alt="FitZone">
    <img class="grande" src="logo-fitzone-branca.svg" alt="FitZone">
  </div>
</body>
</html>
